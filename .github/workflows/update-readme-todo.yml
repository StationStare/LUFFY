name: Update README TODO list

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/update-readme-todo.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-todo-dev
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev with full history
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Rebuild README TODO section
        run: |
          python - <<'PY'
          from pathlib import Path
          import difflib
          import re
          import subprocess

          MAIN_SHA = "266cbc22215201a93c02e37200fe32be98a9e931"
          TITLE = "### 📝 Complete TODO List"
          README = Path("README.md")
          TODO_RE = re.compile(r"\bTODO\b")
          ENTRY_RE = re.compile(r"^- \[ \] \*\*(.+?):([0-9]+)\*\* - (.*)$", re.MULTILINE)


          def git_bytes(*args):
              return subprocess.check_output(["git", *args])


          def collect_todos(ref):
              entries = []
              paths = git_bytes("ls-tree", "-r", "--name-only", ref).decode("utf-8").splitlines()
              for path in paths:
                  if not path.endswith(".py"):
                      continue
                  raw = git_bytes("show", f"{ref}:{path}")
                  try:
                      text = raw.decode("utf-8")
                  except UnicodeDecodeError:
                      text = raw.decode("latin-1")
                  for line_number, line in enumerate(text.splitlines(), 1):
                      match = TODO_RE.search(line)
                      if match is None:
                          continue
                      description = line[match.end():].strip()
                      if description.startswith(":"):
                          description = description[1:].strip()
                      entries.append((path, line_number, description))
              entries.sort(key=lambda item: (item[0], item[1]))
              return entries


          def format_entry(entry):
              path, line_number, description = entry
              return f"- [ ] **{path}:{line_number}** - {description}"


          def parse_entries(section):
              return [(path, int(line_number), description)
                      for path, line_number, description in ENTRY_RE.findall(section)]


          original = README.read_bytes().decode("utf-8")
          if original.count(TITLE) != 1:
              raise RuntimeError(f"Expected exactly one {TITLE!r}")
          title_pos = original.index(TITLE)
          next_heading = re.search(r"^## ", original[title_pos + len(TITLE):], re.MULTILINE)
          if next_heading is None:
              raise RuntimeError("Could not find the heading after the TODO section")
          section_end = title_pos + len(TITLE) + next_heading.start()
          old_section = original[title_pos:section_end]
          baseline_entries = parse_entries(old_section)
          main_entries = collect_todos(MAIN_SHA)

          changed_py_paths = {
              path for path in git_bytes("diff", "--name-only", MAIN_SHA, "HEAD").decode("utf-8").splitlines()
              if path.endswith(".py")
          }
          print("Changed Python paths:", sorted(changed_py_paths))

          # The README is an intentionally curated baseline, not a complete
          # regeneration of every pre-existing TODO. Validate only the files
          # changed between main and dev, then apply just that file's TODO diff.
          for changed_path in sorted(changed_py_paths):
              baseline_for_path = [entry for entry in baseline_entries if entry[0] == changed_path]
              main_for_path = [entry for entry in main_entries if entry[0] == changed_path]
              if baseline_for_path != main_for_path:
                  diff = "\n".join(difflib.unified_diff(
                      [format_entry(entry) for entry in baseline_for_path],
                      [format_entry(entry) for entry in main_for_path],
                      fromfile=f"README baseline {changed_path}",
                      tofile=f"main Python TODOs {changed_path}",
                      lineterm="",
                  ))
                  print(diff[:20000])
                  raise RuntimeError(f"Baseline TODOs do not match main for changed file {changed_path}")

          dev_entries = collect_todos("HEAD")

          # Preserve the established baseline for every untouched file. For each
          # changed file, replace its matching main TODOs with the dev TODOs.
          merged_entries = [entry for entry in baseline_entries if entry[0] not in changed_py_paths]
          merged_entries.extend(entry for entry in dev_entries if entry[0] in changed_py_paths)
          merged_entries.sort(key=lambda item: (item[0], item[1]))

          if merged_entries == baseline_entries:
              raise RuntimeError("No TODO changes were produced")

          new_section = TITLE + "\n\n" + "\n".join(format_entry(entry) for entry in merged_entries) + "\n\n"
          updated = original[:title_pos] + new_section + original[section_end:]

          # Guard against accidental edits outside the requested section.
          new_title_pos = updated.index(TITLE)
          new_next_heading = re.search(r"^## ", updated[new_title_pos + len(TITLE):], re.MULTILINE)
          new_section_end = new_title_pos + len(TITLE) + new_next_heading.start()
          if updated[:title_pos] != original[:title_pos] or updated[new_section_end:] != original[section_end:]:
              raise RuntimeError("Content outside the TODO section changed")
          if parse_entries(updated[new_title_pos:new_section_end]) != merged_entries:
              raise RuntimeError("New TODO section did not round-trip")
          if updated.count(TITLE) != 1:
              raise RuntimeError("TODO title was duplicated or removed")

          README.write_bytes(updated.encode("utf-8"))
          workflow_file = Path(".github/workflows/update-readme-todo.yml")
          if workflow_file.exists():
              workflow_file.unlink()

          print(f"Baseline/main TODOs: {len(baseline_entries)}")
          print(f"Dev TODOs (all files): {len(dev_entries)}")
          print(f"Merged README TODOs: {len(merged_entries)}")
          print("Changed entries in affected files:")
          for entry in merged_entries:
              if entry[0] in changed_py_paths:
                  print(format_entry(entry))
          print("TODO section diff:")
          print("\n".join(difflib.unified_diff(
              old_section.splitlines(),
              new_section.splitlines(),
              fromfile="README before",
              tofile="README after",
              lineterm="",
          )))
          PY

      - name: Commit and push README update
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "docs: update TODO list for dev implementation"
          git push origin HEAD:dev
